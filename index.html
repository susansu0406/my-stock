        let activeBroker = '全部';

        function unlockApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            render();
        }

        function render() {
            const listEl = document.getElementById('stock-list');
            listEl.innerHTML = '';

            let totalVal = 0;
            let totalPledge = 0;
            let pledgedStockVal = 0;

            const filtered = activeBroker === '全部' ? stockData : stockData.filter(s => s.broker === activeBroker);

            filtered.forEach(s => {
                const marketVal = s.shares * s.price;
                totalVal += marketVal;
                
                let maintenanceRate = 0;
                if (s.isPledged && s.pledgeAmount > 0) {
                    totalPledge += s.pledgeAmount;
                    pledgedStockVal += marketVal;
                    maintenanceRate = ((marketVal / s.pledgeAmount) * 100).toFixed(1);
                }

                listEl.innerHTML += `
                    <div class="bg-gray-800 border border-gray-700/60 rounded-xl p-4 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2">

                        <div class="text-right">

            let totalInterest = 0;
            const liabEl = document.getElementById('liability-list');
            liabEl.innerHTML = '';
            liabilityData.forEach(l => {
                const monthly = (l.amount * (l.rate / 100)) / 12;
                totalInterest += monthly;
                liabEl.innerHTML += `
                    <div class="bg-gray-800/60 p-3 rounded-lg flex justify-between text-xs">
                        <span>${l.name} (NT$ ${l.amount.toLocaleString()} | ${l.rate}%)</span>
                        <span class="text-gray-300">預估月息 ≈ NT$ ${Math.round(monthly).toLocaleString()}</span>
                    </div>
                `;
            });

            document.getElementById('total-stock-val').innerText = 'NT$ ' + Math.round(totalVal).toLocaleString();
            document.getElementById('total-pledge-val').innerText = 'NT$ ' + Math.round(totalPledge).toLocaleString();
            document.getElementById('total-monthly-interest').innerText = 'NT$ ' + Math.round(totalInterest).toLocaleString();

            const overallRate = totalPledge > 0 ? ((pledgedStockVal / totalPledge) * 100).toFixed(1) : 0;
            const rateEl = document.getElementById('total-maintenance-rate');
            rateEl.innerText = overallRate + '%';
            rateEl.className = `text-2xl font-black ${overallRate < 160 ? 'text-red-500' : 'text-green-400'}`;
        }

        function filterBroker(broker) {
            activeBroker = broker;
            render();
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ stocks: stockData, liabilities: liabilityData }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "資產防禦塔_離線備份.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function processScreenshot(event) {
            const file = event.target.files[0];
            if (!file) return;
            const statusEl = document.getElementById('ocr-status');
            statusEl.classList.remove('hidden');
            try {
                const worker = await Tesseract.createWorker('chi_tra');
                const ret = await worker.recognize(file);
                await worker.terminate();
                statusEl.classList.add('hidden');
                alert("掃描完成！分析結果已儲存。");
            } catch (err) {
                statusEl.classList.add('hidden');
                alert("離線辨識發生異常，請重試");
            }
        }
