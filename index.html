<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>個人資產防禦塔</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="資產防禦塔">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-12">

    <!-- 1. 解鎖防護遮罩 -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-gray-900 flex flex-col items-center justify-center p-6">
        <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-blue-500/50">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4"></path></svg>
        </div>
        <h2 class="text-xl font-bold mb-2">個人資產防禦塔</h2>
        <p class="text-gray-400 text-sm mb-6">請驗證身份以進入儀表板</p>
        <button id="unlock-btn" type="button" class="w-full max-w-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg transition active:scale-95">解鎖進入</button>
    </div>

    <!-- 2. App 主要內容區 -->
    <div id="app-content" class="hidden max-w-lg mx-auto p-4">
        
        <!-- 頂部總覽資產卡片 -->
        <div class="bg-gradient-to-br from-blue-700 to-indigo-900 rounded-2xl p-5 shadow-xl mb-6">
            <div class="flex justify-between items-center">
                <span class="text-xs text-blue-200">總資產與質押概況</span>
                <button id="reset-btn" type="button" class="text-[10px] bg-red-500/30 text-red-200 border border-red-500/40 px-2 py-0.5 rounded-full">重設快取資料</button>
            </div>
            <div class="flex justify-between items-baseline mt-2">
                <div>
                    <p class="text-xs text-blue-300">股票總市值</p>
                    <p id="total-stock-val" class="text-2xl font-black">NT$ 0</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-blue-300">整體質押維持率</p>
                    <p id="total-maintenance-rate" class="text-2xl font-black text-green-400">0%</p>
                </div>
            </div>
            <div class="border-t border-blue-500/30 my-3 pt-2 flex justify-between text-xs text-blue-200">
                <span>質押總借款: <strong id="total-pledge-val">NT$ 0</strong></span>
                <span>預估每月利息: <strong id="total-monthly-interest">NT$ 0</strong></span>
            </div>
        </div>

        <!-- 截圖上傳與備份區 -->
        <div class="bg-gray-800 rounded-xl p-4 mb-6 shadow-md border border-gray-700 space-y-3">
            <p class="text-sm font-semibold flex items-center justify-between">
                <span>📸 截圖 OCR 與資料管理</span>
            </p>
            <input type="file" id="screenshot-input" accept="image/*" class="hidden" onchange="processScreenshot(event)">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="document.getElementById('screenshot-input').click()" class="bg-gray-700 hover:bg-gray-600 text-blue-400 border border-dashed border-blue-500/50 py-2.5 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1">
                    上傳對帳單截圖
                </button>
                <button onclick="exportBackup()" class="bg-gray-700 hover:bg-gray-600 text-green-400 border border-gray-600 py-2.5 rounded-lg text-xs font-medium transition">
                    匯出離線備份 JSON
                </button>
            </div>
            <div id="ocr-status" class="text-xs text-yellow-400 hidden">正在掃描截圖內容...</div>
        </div>

        <!-- 券商篩選分頁 -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-4 text-xs">
            <button onclick="filterBroker('全部')" id="btn-全部" class="broker-btn bg-blue-600 text-white px-4 py-2 rounded-full font-medium shrink-0">全部 (點擊展開明細)</button>
            <button onclick="filterBroker('證金')" id="btn-證金" class="broker-btn bg-gray-800 text-gray-300 px-4 py-2 rounded-full font-medium shrink-0">證金</button>
            <button onclick="filterBroker('富邦')" id="btn-富邦" class="broker-btn bg-gray-800 text-gray-300 px-4 py-2 rounded-full font-medium shrink-0">富邦</button>
            <button onclick="filterBroker('國泰')" id="btn-國泰" class="broker-btn bg-gray-800 text-gray-300 px-4 py-2 rounded-full font-medium shrink-0">國泰</button>
            <button onclick="filterBroker('中信')" id="btn-中信" class="broker-btn bg-gray-800 text-gray-300 px-4 py-2 rounded-full font-medium shrink-0">中信</button>
        </div>

        <!-- 持股明細列表 -->
        <div class="space-y-3" id="stock-list"></div>

        <!-- 負債與利息清單 -->
        <div class="mt-8">
            <h3 class="text-sm font-bold text-gray-400 mb-3">房貸 / 信貸 / 其他負債試算</h3>
            <div id="liability-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const initialStocks = [
            { name: '台積電', code: '2330', shares: 1000, price: 2500, broker: '證金', isPledged: true, pledgeAmount: 950000 },
            { name: '國泰費城半導體', code: '00830', shares: 28000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 759000 },
            { name: '台灣元大50', code: '0050', shares: 8000, price: 112.8, broker: '證金', isPledged: true, pledgeAmount: 350000 },
            { name: '復華SP500', code: '00924', shares: 20000, price: 34.01, broker: '證金', isPledged: true, pledgeAmount: 280000 },
            { name: '國泰費城半導體', code: '00830', shares: 5000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 250000 },
            { name: '台灣元大50', code: '0050', shares: 6000, price: 112.8, broker: '證金', isPledged: true, pledgeAmount: 150000 },
            { name: '復華SP500', code: '00924', shares: 10000, price: 34.01, broker: '證金', isPledged: true, pledgeAmount: 130000 },
            { name: '富邦科技', code: '0052', shares: 4000, price: 65.95, broker: '證金', isPledged: true, pledgeAmount: 100000 },
            { name: '富邦科技', code: '0052', shares: 4000, price: 65.95, broker: '證金', isPledged: true, pledgeAmount: 100000 },

            { name: '國泰費城半導體', code: '00830', shares: 3000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 90000 },
            { name: '富邦科技', code: '0052', shares: 3000, price: 65.95, broker: '證金', isPledged: true, pledgeAmount: 90000 },
            { name: '主動復華未來50', code: '00981A', shares: 10000, price: 18.69, broker: '證金', isPledged: true, pledgeAmount: 80000 },
            { name: '主動復華未來50', code: '00981A', shares: 8000, price: 18.69, broker: '證金', isPledged: true, pledgeAmount: 80000 },
            { name: '國泰費城半導體', code: '00830', shares: 2000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 80000 },
            { name: '國泰費城半導體', code: '00830', shares: 2000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 80000 },
            { name: '國泰費城半導體', code: '00830', shares: 2000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 80000 },
            { name: '國泰費城半導體', code: '00830', shares: 2000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 70000 },
            { name: '國泰費城半導體', code: '00830', shares: 2000, price: 91.25, broker: '證金', isPledged: true, pledgeAmount: 70000 },
            { name: '台灣元大50', code: '0050', shares: 1000, price: 112.8, broker: '證金', isPledged: true, pledgeAmount: 48000 },
            { name: '富邦科技', code: '0052', shares: 1000, price: 65.95, broker: '證金', isPledged: true, pledgeAmount: 28000 },
            { name: '主動復華未來50', code: '00981A', shares: 2000, price: 18.69, broker: '證金', isPledged: true, pledgeAmount: 17000 },
            { name: '奔騰', code: 'BT', shares: 1, price: 14387, broker: '證金', isPledged: true, pledgeAmount: 10000 },
            { name: '元大台灣50正二', code: '00631L', shares: 56000, price: 39.58, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '主動復華未來50', code: '00981A', shares: 20000, price: 18.69, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '主動群益科技創新', code: '00992A', shares: 7000, price: 19.4, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '主動統一台股增長', code: '00988A', shares: 6000, price: 31.44, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '主動復華金融股息', code: '00982A', shares: 6000, price: 15.95, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '國泰費城半導體', code: '00830', shares: 4150, price: 91.25, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '富邦NASDAQ100', code: '00662', shares: 4000, price: 125.6, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '統一FANG+', code: '00757', shares: 1020, price: 144.1, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '主動統一升級', code: '00989A', shares: 1000, price: 9.74, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '台積電', code: '2330', shares: 790, price: 2500, broker: '國泰', isPledged: false, pledgeAmount: 0 },
            { name: '金居', code: '8358', shares: 100, price: 519, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '複委託 (美股現值)', code: 'US_STOCK', shares: 1, price: 20320, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '台灣元大50', code: '0050', shares: 1000, price: 112.8, broker: '證金', isPledged: false, pledgeAmount: 0 },
            { name: '國泰費城半導體', code: '00830', shares: 1000, price: 91.25, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '台積電', code: '2330', shares: 12, price: 2500, broker: '中信', isPledged: false, pledgeAmount: 0 },
            { name: '台積電', code: '2330', shares: 2827, price: 2500, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '元大台灣50正二', code: '00631L', shares: 23000, price: 39.58, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '復華SP500', code: '00924', shares: 100, price: 34.01, broker: '富邦', isPledged: false, pledgeAmount: 0 },
            { name: '複委託 (美股現值)', code: 'US_STOCK2', shares: 1, price: 32905, broker: '富邦', isPledged: false, pledgeAmount: 0 }
        ];

        let liabilityData = [
            { name: '房屋貸款 A', amount: 10693781, rate: 2.15 },
            { name: '房屋貸款 B', amount: 6893440, rate: 2.15 },
            { name: '信用貸款', amount: 4144071, rate: 2.88 },
            { name: '學長借款', amount: 8800000, rate: 0.0 }
        ];

        let rawStockData = initialStocks;
        let activeBroker = '全部';

        document.addEventListener('DOMContentLoaded', () => {
            const unlockBtn = document.getElementById('unlock-btn');
            const authScreen = document.getElementById('auth-screen');
            const appContent = document.getElementById('app-content');
            const resetBtn = document.getElementById('reset-btn');

            if (unlockBtn) {
                unlockBtn.addEventListener('click', () => {
                    authScreen.style.display = 'none';
                    appContent.classList.remove('hidden');
                    render();
                });
            }

            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    localStorage.clear();
                    location.reload();
                });
            }
        });

        function toggleDetail(cardId) {
            const detailEl = document.getElementById(cardId);
            const iconEl = document.getElementById(cardId + '-icon');
            if (detailEl) {
                if (detailEl.classList.contains('hidden')) {
                    detailEl.classList.remove('hidden');
                    if (iconEl) iconEl.innerText = '▲';
                } else {
                    detailEl.classList.add('hidden');
                    if (iconEl) iconEl.innerText = '▼';
                }
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ stocks: rawStockData, liabilities: liabilityData }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "資產防禦塔_離線備份.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function processScreenshot(event) {
            const file = event.target.files[0];
            if (!file) return;
            const statusEl = document.getElementById('ocr-status');
            statusEl.classList.remove('hidden');
            try {
                const worker = await Tesseract.createWorker('chi_tra');
                const ret = await worker.recognize(file);
                await worker.terminate();
                statusEl.classList.add('hidden');
                alert("掃描完成！分析結果已儲存。");
            } catch (err) {
                statusEl.classList.add('hidden');
                alert("圖片解析失敗，請確認圖片格式是否清晰並重新嘗試！");
            }
        }

        function render() {
            const listEl = document.getElementById('stock-list');
            listEl.innerHTML = '';

            document.querySelectorAll('.broker-btn').forEach(btn => {
                btn.className = "broker-btn bg-gray-800 text-gray-300 px-4 py-2 rounded-full font-medium shrink-0";
            });
            const activeBtn = document.getElementById(`btn-${activeBroker}`);
            if (activeBtn) activeBtn.className = "broker-btn bg-blue-600 text-white px-4 py-2 rounded-full font-medium shrink-0";

            let grandTotalVal = 0;
            let grandTotalPledge = 0;
            let grandPledgedStockVal = 0;

            rawStockData.forEach(s => {
                const mv = s.shares * s.price;
                grandTotalVal += mv;
                if (s.isPledged && s.pledgeAmount > 0) {
                    grandTotalPledge += s.pledgeAmount;
                    grandPledgedStockVal += mv;
                }
            });

            if (activeBroker === '全部') {
                const aggregated = {};
                rawStockData.forEach((s) => {
                    const key = s.code + '_' + s.name;
                    if (!aggregated[key]) {
                        aggregated[key] = {
                            code: s.code,
                            name: s.name,
                            totalShares: 0,
                            price: s.price,
                            totalPledge: 0,
                            pledgedShares: 0,
                            details: []
                        };
                    }
                    aggregated[key].totalShares += s.shares;
                    aggregated[key].details.push(s);
                    if (s.isPledged) {
                        aggregated[key].totalPledge += s.pledgeAmount;
                        aggregated[key].pledgedShares += s.shares;
                    }
                });

                Object.values(aggregated).forEach((item, index) => {
                    const totalMV = item.totalShares * item.price;
                    const cardId = `detail-${index}`;
                    
                    let mRateText = '';
                    if (item.totalPledge > 0) {
                        const pledgedMV = item.pledgedShares * item.price;
                        const mRate = ((pledgedMV / item.totalPledge) * 100).toFixed(1);
                        mRateText = `<span class="${mRate < 160 ? 'text-red-400 font-bold' : 'text-orange-400'}">總維持率 ${mRate}%</span>`;
                    }

                    let detailRowsHtml = '';
                    item.details.forEach(d => {
                        const subMV = d.shares * d.price;
                        let subRateText = '';
                        if (d.isPledged && d.pledgeAmount > 0) {
                            const subRate = ((subMV / d.pledgeAmount) * 100).toFixed(1);
                            subRateText = ` | 維持率: ${subRate}% (借 $${d.pledgeAmount.toLocaleString()})`;
                        }
                        detailRowsHtml += `
                            <div class="flex justify-between items-center py-1.5 border-b border-gray-700/40 text-xs text-gray-300">
                                <div>
                                    <span class="bg-gray-700 text-blue-300 px-1.5 py-0.5 rounded text-[10px] mr-1.5">${d.broker}</span>
                                    <span>${d.shares.toLocaleString()} 股</span>
                                    <span class="text-gray-400 text-[11px]">${subRateText}</span>
                                </div>
                                <div class="font-medium text-white">NT$ ${Math.round(subMV).toLocaleString()}</div>
                            </div>
                        `;
                    });

                    listEl.innerHTML += `
                        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 cursor-pointer hover:border-blue-500/50 transition" onclick="toggleDetail('${cardId}')">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-base text-white">${item.name}</span>
                                        <span class="text-xs text-blue-400 font-mono bg-blue-950 px-2 py-0.5 rounded border border-blue-800">${item.code}</span>
                                        <span id="${cardId}-icon" class="text-xs text-gray-400 ml-1">▼</span>
                                    </div>
                                    <p class="text-[11px] text-blue-300 mt-1">點擊展開各券商分布明細 (${item.details.length} 筆)</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] text-gray-400">總市值</span>
                                    <p class="font-black text-base text-blue-300">NT$ ${Math.round(totalMV).toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="border-t border-gray-700/60 pt-2 mt-2 flex justify-between items-center text-xs">
                                <div class="text-gray-300">
                                    <span>一股: <strong class="text-yellow-400">$${item.price.toLocaleString()}</strong></span>
                                    <span class="ml-2">總股數: <strong class="text-white">${item.totalShares.toLocaleString()}</strong> 股</span>
                                </div>
                                <div>${mRateText}</div>
                            </div>
                            
                            <div id="${cardId}" class="hidden mt-3 pt-2 border-t border-gray-700/80 bg-gray-900/50 -mx-4 -mb-4 p-4 rounded-b-xl space-y-1">
                                <p class="text-[11px] font-semibold text-gray-400 mb-2">各券商持股拆解：</p>
                                ${detailRowsHtml}
                            </div>
                        </div>
                    `;
                });

            } else {
                const filtered = rawStockData.filter(s => s.broker === activeBroker);
                filtered.forEach(s => {
                    const marketVal = s.shares * s.price;
                    let mRateText = '';
                    if (s.isPledged && s.pledgeAmount > 0) {
                        const mRate = ((marketVal / s.pledgeAmount) * 100).toFixed(1);
                        mRateText = `<span class="${mRate < 160 ? 'text-red-400 font-bold' : 'text-orange-400'}">維持率 ${mRate}%</span>`;
                    }

                    listEl.innerHTML += `
                        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 space-y-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-base text-white">${s.name}</span>
                                        <span class="text-xs text-blue-400 font-mono bg-blue-950 px-2 py-0.5 rounded border border-blue-800">${s.code}</span>
                                    </div>
                                    <p class="text-xs text-gray-400 mt-1">券商: <span class="text-gray-200">${s.broker}</span></p>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] text-gray-400">總金額</span>
                                    <p class="font-black text-base text-blue-300">NT$ ${Math.round(marketVal).toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="border-t border-gray-700/60 pt-2 flex justify-between items-center text-xs">
                                <div class="text-gray-300">
                                    <span>一股: <strong class="text-yellow-400">$${s.price.toLocaleString()}</strong></span>
                                    <span class="ml-2">股數: <strong class="text-white">${s.shares.toLocaleString()}</strong> 股</span>
                                </div>
                                <div>${mRateText}</div>
                            </div>
                        </div>
                    `;
                });
            }

            let totalInterest = 0;
            const liabEl = document.getElementById('liability-list');
            liabEl.innerHTML = '';
            liabilityData.forEach(l => {
                const monthly = (l.amount * (l.rate / 100)) / 12;
                totalInterest += monthly;
                liabEl.innerHTML += `
                    <div class="bg-gray-800/60 p-3 rounded-lg flex justify-between text-xs">
                        <span>${l.name} (NT$ ${l.amount.toLocaleString()} | ${l.rate}%)</span>
                        <span class="text-gray-300">預估月息 ≈ NT$ ${Math.round(monthly).toLocaleString()}</span>
                    </div>
                `;
            });

            document.getElementById('total-stock-val').innerText = 'NT$ ' + Math.round(grandTotalVal).toLocaleString();
            document.getElementById('total-pledge-val').innerText = 'NT$ ' + Math.round(grandTotalPledge).toLocaleString();
            document.getElementById('total-monthly-interest').innerText = 'NT$ ' + Math.round(totalInterest).toLocaleString();

            const overallRate = grandTotalPledge > 0 ? ((grandPledgedStockVal / grandTotalPledge) * 100).toFixed(1) : 0;
            const rateEl = document.getElementById('total-maintenance-rate');
            rateEl.innerText = overallRate + '%';
            rateEl.className = `text-2xl font-black ${overallRate < 160 ? 'text-red-500' : 'text-green-400'}`;
        }

        function filterBroker(broker) {
            activeBroker = broker;
            render();
        }
    </script>
</body>
</html>
